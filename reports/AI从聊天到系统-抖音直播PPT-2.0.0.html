:root{--bg:#eee9e0;--paper:#fffdf9;--ink:#20211f;--muted:#62615b;--orange:#dc5b27;--line:#ddd4c7;--cream:#fff3e8;--green:#536b58;--shadow:0 24px 70px rgba(65,47,27,.16)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}button{font:inherit}.workspace{height:100dvh;display:grid;grid-template-columns:minmax(360px,1fr) minmax(340px,470px);gap:clamp(20px,4vw,64px);align-items:center;justify-items:center;padding:22px clamp(20px,4vw,64px)}.viewer{height:min(92dvh,960px);aspect-ratio:9/16;width:auto;max-width:min(45vw,540px);position:relative;background:var(--paper);border:1px solid #ded4c7;border-radius:30px;box-shadow:var(--shadow);overflow:hidden}.slide{height:100%;width:100%;padding:8.5% 8%;display:flex;flex-direction:column;position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .28s ease,transform .28s ease;background:radial-gradient(ellipse at 100% 0%,#fff3e3 0,transparent 44%),var(--paper)}.slide.active{opacity:1;pointer-events:auto;transform:translateY(0)}.s-top{display:flex;align-items:center;justify-content:space-between;font:700 clamp(10px,1.1vh,13px) ui-monospace,monospace;letter-spacing:.12em;color:var(--orange);text-transform:uppercase}.s-logo{color:#8d887f;letter-spacing:.05em}.s-title{font-size:clamp(26px,3.25vh,44px);line-height:1.22;letter-spacing:-.045em;margin:8% 0 3%;font-weight:800;max-width:100%}.s-lead{font-size:clamp(16px,1.9vh,23px);line-height:1.5;color:#4d4c47;margin:0;max-width:100%}.visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:7% 0 4%;}.cards{width:100%;display:grid;gap:10px}.cards.cols2{grid-template-columns:repeat(2,1fr)}.cards.cols3{grid-template-columns:repeat(3,1fr)}.cards.cols4{grid-template-columns:repeat(2,1fr)}.vcard{border:1px solid var(--line);background:#fffefa;border-radius:16px;padding:14px 13px;min-height:78px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 22px rgba(82,66,44,.05)}.vcard strong{font-size:clamp(15px,1.8vh,21px);line-height:1.25}.vcard small{font-size:clamp(11px,1.3vh,15px);line-height:1.4;color:var(--muted);margin-top:5px}.cards.cols3 .vcard{padding:12px 8px;min-height:110px}.cards.cols3 .vcard strong{font-size:clamp(12px,1.45vh,17px)}.cards.cols3 .vcard small{font-size:clamp(10px,1.1vh,13px)}.arrowline{color:#d9b49b;font-size:18px;text-align:center;margin:-3px 0}.statement{width:100%;border-left:4px solid var(--orange);background:var(--cream);border-radius:0 14px 14px 0;padding:16px 17px;font-weight:750;font-size:clamp(16px,2vh,24px);line-height:1.42}.motif{width:100%;display:flex;flex-direction:column;gap:12px}.motif-row{display:flex;align-items:center;gap:10px}.motif-dot{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#fbe3d3;color:var(--orange);font-weight:800;flex:0 0 auto}.motif-bar{height:8px;border-radius:10px;background:linear-gradient(90deg,#e8642a,#f1b17f);flex:1}.split{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.split>div{min-height:155px;border-radius:18px;padding:14px;background:#f8f3eb;border:1px solid var(--line)}.split>div:last-child{background:#fdf0e6}.split b{font-size:17px}.split span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}.progress{position:absolute;left:8%;right:8%;bottom:4.1%;height:3px;background:#e8e1d7;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange);transition:width .25s}.s-page{position:absolute;right:8%;bottom:5.1%;font:700 10px ui-monospace,monospace;color:#918a80}.host{height:min(88dvh,850px);width:min(430px,34vw);display:flex;flex-direction:column;gap:16px}.host-head{display:flex;align-items:center;justify-content:space-between}.host-title{font-size:19px;font-weight:800}.version{font:700 11px ui-monospace,monospace;color:var(--orange);letter-spacing:.08em}.cuebox{min-height:0;flex:1;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:25px 25px 20px;box-shadow:0 12px 38px rgba(65,47,27,.07)}.cue-label{font:700 11px ui-monospace,monospace;letter-spacing:.1em;color:var(--orange);margin-bottom:10px}.cuebox h2{font-size:22px;line-height:1.35;margin:0 0 14px}.script{font-size:18px;line-height:1.82;color:#343530;white-space:pre-wrap}.bridge{margin-top:22px;padding:13px 15px;border-left:3px solid var(--green);background:#edf2eb;border-radius:0 12px 12px 0;font-size:15px;line-height:1.6}.source-host{font-size:12px;line-height:1.6;color:#777168;margin-top:17px;overflow-wrap:anywhere}.host-controls{display:flex;gap:8px;flex-wrap:wrap}.host-controls button,.open-audience{border:1px solid #d5cbbc;background:#fffdf9;color:var(--ink);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}.host-controls button:hover,.open-audience:hover{border-color:var(--orange);color:var(--orange)}.open-audience{background:var(--ink);color:#fff;border-color:var(--ink)}.help{font-size:12px;color:#79756e;line-height:1.5}.viewer-only{height:min(100dvh,177.7778vw);width:min(100vw,56.25dvh);max-width:100vw;aspect-ratio:9/16;border:0;border-radius:0;box-shadow:none}.audience-mode{background:#111}.audience-mode .workspace{display:grid;place-items:center;padding:0}.audience-mode .slide{border-radius:0}.refs{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:12px;line-height:1.55;color:#746f67}.mobile-controls{display:none}.refs a{color:#6f513c;text-decoration-color:#d4b69c;text-underline-offset:2px}.refs a:hover{color:var(--orange)}.cover-art{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:16px;border:1px solid rgba(180,150,110,.25);box-shadow:0 12px 30px rgba(82,66,44,.1)}
@media(max-width:760px){.workspace{grid-template-columns:1fr;grid-template-rows:auto minmax(220px,1fr);gap:10px;padding:10px;align-items:start}.viewer{height:min(51dvh,560px);max-width:min(90vw,315px);border-radius:20px}.s-title{font-size:clamp(23px,3.3vh,34px);margin:5% 0 2%}.s-lead{font-size:clamp(15px,1.8vh,19px)}.visual{margin:4% 0 2%}.host{height:auto;min-height:0;width:min(100%,520px);gap:8px}.host-head{display:none}.cuebox{padding:15px 17px;border-radius:16px}.cuebox h2{font-size:18px;margin-bottom:7px}.script{font-size:16px;line-height:1.65}.bridge{margin-top:10px;padding:8px 10px;font-size:13px}.source-host{display:none}.host-controls{justify-content:center}.host-controls button,.open-audience{padding:8px 12px;font-size:12px}.help{display:none}.viewer-only{height:100dvh;width:min(100vw,56.25dvh);max-width:100vw;border:0;border-radius:0}.audience-mode .workspace{display:block;padding:0}.audience-mode .viewer{height:100dvh;width:min(100vw,56.25dvh);max-width:100vw}.mobile-controls{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.scene{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:7px;margin:0}.scene img{display:block;width:100%;height:calc(100% - 24px);min-height:0;object-fit:cover;object-position:center 28%;border-radius:16px;border:1px solid rgba(180,150,110,.25);box-shadow:0 12px 30px rgba(82,66,44,.1)}.scene figcaption{height:18px;flex:0 0 auto;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,1.15vh,14px);line-height:1.25;color:#746f67}
@media(max-width:760px){.scene{gap:4px}.scene img{height:calc(100% - 18px);border-radius:12px}.scene figcaption{height:14px;font-size:10px}}
</style></head><body><div id="app"></div><script>
const slides=[{"section": "开场", "title": "AI 的下一站，会是任务入口吗？", "lead": "从计算普及，到 AI 替人跨应用办事。", "visual": ["计算普及", "连接世界", "理解意图", "执行任务", "协调入口"], "mode": "cover", "line": "今天不猜哪家公司会赢。我想从计算机、互联网、手机一路讲到今天的 AI，再讨论一个问题：当 AI 不只回答问题，而是能帮我们推进任务，下一层入口会长什么样？这是一种趋势推演，不是确定结论。", "bridge": "先回到一个更大的问题：每一代技术，究竟改变了什么？", "refs": "演讲者判断；不构成对具体产品的承诺。"}, {"section": "一条主线", "title": "每一代计算，都在降低使用门槛", "lead": "从“机器能算”到“人能直接表达目的”。", "visual": ["计算普及", "信息连接", "偏好理解", "意图表达", "任务协作"], "mode": "steps", "line": "想象电饭煲：里面有复杂电路，但你不需要懂电路，按下按钮就能煮饭。技术普及常常也是这样，先把复杂藏起来，再让更多人用得上。", "bridge": "先看计算机，怎样从少数机构走进日常生活。", "refs": "作为讲述框架与趋势推演，不把阶段划分说成严格的技术史分期。"}, {"section": "计算普及", "title": "计算机，从少数机构走向个人日常", "lead": "技术变普及，靠的是硬件、软件和生态一起成熟。", "visual": ["大型计算", "个人电脑", "图形界面", "日常工具"], "mode": "steps", "line": "早期计算机像一整间房，普通家庭买不起也不会操作。个人电脑、鼠标和图形界面出现后，写文档、算账、存照片逐渐成了日常。关键不只是机器变小，而是普通人能用。", "bridge": "当越来越多人可以使用电脑，下一步就是把电脑连接起来。", "refs": "ENIAC 历史：University of Pennsylvania。Macintosh 与 Windows 的发布时间见 Apple、Microsoft 官方资料。避免传播“五台电脑”未经证实的名言。"}, {"section": "连接世界", "title": "互联网，让信息跨过设备和地域", "lead": "电脑从单机工具，变成连接信息的入口。", "visual": ["一台电脑", "多台设备", "全球网络", "共同访问"], "mode": "network", "line": "互联网可以想成把无数图书馆和邮局连在一起。以前找资料要去一个地方、问一个人；联网后，家里的一台电脑也能访问远处的信息。网页让信息有了更容易浏览的入口。", "bridge": "后来，连接能力又被装进了口袋。", "refs": "CERN, The birth of the Web：https://home.cern/science/computing/birth-web"}, {"section": "移动入口", "title": "智能手机，把网络带到每个人手边", "lead": "通话、信息和应用，汇进随身设备。", "visual": ["随身连接", "触屏交互", "移动应用", "日常服务"], "mode": "steps", "line": "智能手机像把电话、相机、地图和音乐播放器装进一个口袋。它改变的不只是设备，而是我们随时能上网、随手能用服务的习惯。", "bridge": "基础设施变快，也会打开新的体验空间。", "refs": "Apple Newsroom, iPhone 发布资料：https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}, {"section": "基础设施", "title": "网速提升，创造条件，不保证答案", "lead": "新能力出现后，还要等场景、产品和习惯一起成熟。", "visual": ["网络能力", "终端设备", "应用场景", "用户习惯"], "mode": "equation", "line": "修更宽的路不会自动带来新生活，但会让新事情变得可行。网速提升后，视频通话、移动支付、短视频等场景才更顺手。技术提供条件，产品和人的习惯决定它怎么被使用。", "bridge": "软件不只连接人，也开始根据人的偏好组织内容。", "refs": "ITU, IMT-2020 recommendation: https://www.itu.int/rec/R-REC-M.2083/en"}, {"section": "软件理解用户", "title": "同一个 App，首页可能因人而异", "lead": "推荐系统，用行为信号调整内容排序。", "visual": ["兴趣 A", "兴趣 B", "共同内容池", "不同信息流"], "mode": "split", "line": "同一桌菜，有人先夹辣菜，有人先夹清淡的。推荐系统会参考你点开什么、看多久，再调整内容顺序。它不是读懂了你所有想法，只是在用行为信号猜哪些内容更合你口味。", "bridge": "从软件猜你喜欢什么，到模型听懂你要做什么。", "refs": "Netflix Prize（2006）：https://www.netflixprize.com/；Google Research, YouTube Recommendations：https://research.google/pubs/deep-neural-networks-for-youtube-recommendations/"}, {"section": "AI 理解意图", "title": "从搜索资料，到直接表达问题", "lead": "聊天模型尝试组织答案；重要信息仍要核实。", "visual": ["关键词", "浏览资料", "自己整理", "自然提问", "得到草稿"], "mode": "compare", "line": "搜索像自己走进图书馆，找几本书、翻出相关段落，再整理成答案。聊天模型像先把问题告诉一个助手，请它帮你归纳线索。涉及健康、钱和重要决定，还是要查可靠来源。", "bridge": "想让回答更有用，除了问法，还要给它合适的背景。", "refs": "OpenAI, GPT-4 Technical Report：https://arxiv.org/abs/2303.08774（报告未公开完整训练数据细节）。"}, {"section": "人机协作", "title": "先说清目标，再给它需要的背景", "lead": "任务越清楚、信息越相关，来回沟通越少。", "visual": ["目标", "背景", "约束", "可用结果"], "mode": "stack", "line": "如果只说“做顿饭”，助手不知道几个人吃、家里有什么、有没有忌口。补充“两个大人一个孩子，冰箱有鸡蛋和番茄，不吃辣”，它就更容易给出合适方案。这些背景就是上下文。", "bridge": "当模型能调用工具，它就能从“给建议”走向“做步骤”。", "refs": "Anthropic, Effective Context Engineering：https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents。In-context learning 基础论文：https://arxiv.org/abs/2005.14165。"}, {"section": "从回答到行动", "title": "Agent 会用工具，也会看结果再继续", "lead": "目标 → 拆步骤 → 调工具 → 检查结果。", "visual": ["明确目标", "拆解步骤", "使用工具", "读取反馈", "完成或修正"], "mode": "loop", "line": "Agent 不只告诉你要买鸡翅和可乐，还可能按授权把东西加进购物车。像请家人代买：要说明数量和预算，也要看清订单，付款前最好由你确认。", "bridge": "为什么代码任务先出现这种闭环？因为结果比较容易检查。", "refs": "MCP 官方介绍：https://modelcontextprotocol.io/docs/getting-started/intro；Anthropic, Building Effective Agents：https://www.anthropic.com/engineering/building-effective-agents。"}, {"section": "可验证的任务", "title": "代码适合先试，是因为结果能检查", "lead": "运行、对照、修正，让问题更容易被发现。", "visual": ["读需求", "改代码", "运行验证", "查看差异", "人工确认"], "mode": "loop", "line": "做完不代表做对。买菜要看商品、数量、价格和是否送到；写代码要运行和检查结果。能拿实际结果回来核对，才知道助手有没有真正完成任务。", "bridge": "能做更多事之后，权限边界就变得更重要。", "refs": "Anthropic, Claude 3.7 Sonnet 发布资料：https://www.anthropic.com/news/claude-3-7-sonnet。"}, {"section": "权限与信任", "title": "能执行，也要知道什么时候停下来", "lead": "低风险可自动；高影响动作先确认。", "visual": ["读取 / 草拟", "限定范围内修改", "付款 / 删除 / 发布前确认"], "mode": "tiers", "line": "把低价日用品加进购物车，风险比较低；转账、删除文件或发布内容，影响更大。可以把权限想成家里的钥匙：小事给有限权限，大事保留确认。", "bridge": "这会让人的工作重点从逐步操作，转向设定目标和验收。", "refs": "抖音《直播行为规范》会动态更新；开播前请查看官方规则页面：https://sf3-cdn-tos.douyinstatic.com/obj/ies-hotsoon-draft/webcast_all_anchor/webcast_ban_protocol.html。此处只是内容自查提醒，不构成审核结果。"}, {"section": "工作方式", "title": "AI 扩大工作半径，人负责判断和交付", "lead": "任务链可能变短，责任仍需要人承担。", "visual": ["过去：多环节接力", "现在：人定义目标", "AI 协助推进", "人检查交付"], "mode": "shift", "line": "过去做一件小产品，可能要产品、设计、开发和测试多人接力。AI 能帮一个人处理更多环节，但方向、质量和对外承诺仍由人负责，最后要有人检查和交付。", "bridge": "如果 AI 能跨多个应用推进任务，竞争焦点可能继续往入口移动。", "refs": "FDE、一人公司等词可以作为工作形态讨论，但不说成已经普遍发生的岗位替代。"}, {"section": "趋势推演", "title": "下一层竞争，可能是“谁来协调任务”", "lead": "模型能力之外，还要看入口、工具和信任。", "visual": ["听懂意图", "组织步骤", "协调应用", "权限确认", "回传结果"], "mode": "network", "line": "想象周末带家人出门：要看天气、选路线、安排吃饭，还要记得带东西。能把这些步骤串起来的助手，会比只回答“去哪玩”更有用。它能不能成为新的入口，还需要观察。", "bridge": "可能的实现路径，不止是推出一套新系统。", "refs": "操作系统定义可参考 NIST：https://csrc.nist.gov/glossary/term/OS。本文把“AI OS”明确作为趋势假说使用。"}, {"section": "三种路径", "title": "总入口可能沿三条路演进", "lead": "现有系统、应用接口、跨应用协调层。", "visual": ["系统能力增强", "应用开放动作", "Agent 协调服务"], "mode": "steps", "line": "今天你可以在手机系统里问，也可以打开购物或地图 App 自己办；未来也许有助手能在多个服务间接力。三条路可能并存，关键看是否方便、可靠并获得授权。", "bridge": "那我们怎样判断这条趋势到底有没有发生？", "refs": "Apple App Intents：https://developer.apple.com/documentation/AppIntents；Android AccessibilityService：https://developer.android.com/reference/android/accessibilityservice/AccessibilityService。"}, {"section": "如何观察", "title": "先观察四件事，再判断趋势", "lead": "完成率、可信度、生态、用户授权。", "visual": ["任务能否完成", "结果是否可信", "应用愿不愿接入", "用户愿意授权什么"], "mode": "steps", "line": "判断这个方向有没有进展，可以像检查一次外卖：事情办成了吗，结果对不对，商家是否配合，自己愿不愿让它代办。四项都在改善，才说明入口可能变得有价值。", "bridge": "最后留一个问题，交给直播间的朋友。", "refs": "以上是分析框架与个人推演，未来可被新证据修正。"}, {"section": "收束", "title": "你愿意把哪件日常任务交给 AI？", "lead": "从一个真实场景，继续讨论 AI 的下一步。", "visual": ["听懂目标", "安全执行", "交回结果"], "mode": "rail", "line": "轮到直播间的朋友：如果有一个靠谱助手，你最想先交给它哪件小事？比如规划晚餐、比价买菜、整理账单或安排周末出行。可以把答案打在评论区。", "bridge": "结束时回到核心判断：这是值得观察的方向，不是已经注定的结局。", "refs": "避免口播为确定预测；使用观众可讨论的日常任务作为互动。"}];
