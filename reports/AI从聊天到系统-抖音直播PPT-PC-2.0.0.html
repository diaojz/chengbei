const slides=[{"section": "开场", "title": "AI 的下一站，会是任务入口吗？", "lead": "从计算普及，到 AI 替人跨应用办事。", "visual": ["计算普及", "连接世界", "理解意图", "执行任务", "协调入口"], "mode": "cover", "line": "今天不猜哪家公司会赢。我想从计算机、互联网、手机一路讲到今天的 AI，再讨论一个问题：当 AI 不只回答问题，而是能帮我们推进任务，下一层入口会长什么样？这是一种趋势推演，不是确定结论。", "bridge": "先回到一个更大的问题：每一代技术，究竟改变了什么？", "refs": "演讲者判断；不构成对具体产品的承诺。"}, {"section": "一条主线", "title": "每一代计算，都在降低使用门槛", "lead": "从“机器能算”到“人能直接表达目的”。", "visual": ["计算普及", "信息连接", "偏好理解", "意图表达", "任务协作"], "mode": "steps", "line": "如果把这段历史压缩成一条线，关键不是某个产品突然取代了所有旧产品，而是使用门槛一层层降低：先让更多人用上计算机，再把计算机连起来；随后软件开始理解偏好，今天的模型让人能用自然语言表达意图。下一步，值得观察的是它能不能可靠地帮人完成任务。", "bridge": "先看计算机，怎样从少数机构走进日常生活。", "refs": "作为讲述框架与趋势推演，不把阶段划分说成严格的技术史分期。"}, {"section": "计算普及", "title": "计算机，从少数机构走向个人日常", "lead": "技术变普及，靠的是硬件、软件和生态一起成熟。", "visual": ["大型计算", "个人电脑", "图形界面", "日常工具"], "mode": "steps", "line": "早期大型计算机体积庞大、成本很高，主要由机构使用。后来，个人电脑、图形界面和更成熟的软件降低了使用门槛。讲这一段时，不必依赖“全世界只需要几台电脑”这类出处不稳的轶闻；重点是：真正改变生活的，是技术变得可用、可买、可学习。", "bridge": "当越来越多人可以使用电脑，下一步就是把电脑连接起来。", "refs": "ENIAC 历史：University of Pennsylvania。Macintosh 与 Windows 的发布时间见 Apple、Microsoft 官方资料。避免传播“五台电脑”未经证实的名言。"}, {"section": "连接世界", "title": "互联网，让信息跨过设备和地域", "lead": "电脑从单机工具，变成连接信息的入口。", "visual": ["一台电脑", "多台设备", "全球网络", "共同访问"], "mode": "network", "line": "互联网的发展，让信息可以在不同设备和地点之间传递。万维网又让人们能通过浏览器访问相互链接的信息。要讲准确一点：Web 是互联网之上的重要信息服务，不等于互联网本身。对普通用户来说，最直观的变化是：获取信息、沟通和协作不再局限在一台电脑上。", "bridge": "后来，连接能力又被装进了口袋。", "refs": "CERN, The birth of the Web：https://home.cern/science/computing/birth-web"}, {"section": "移动入口", "title": "智能手机，把网络带到每个人手边", "lead": "通话、信息和应用，汇进随身设备。", "visual": ["随身连接", "触屏交互", "移动应用", "日常服务"], "mode": "steps", "line": "智能手机把通信、网络和软件应用整合在随身设备里，降低了使用互联网的门槛。iPhone 是移动计算普及的重要节点，但它不是第一部智能手机。我们要看的主线仍然是：一个更方便的入口，会让更多人持续使用数字服务。", "bridge": "基础设施变快，也会打开新的体验空间。", "refs": "Apple Newsroom, iPhone 发布资料：https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/"}, {"section": "基础设施", "title": "网速提升，创造条件，不保证答案", "lead": "新能力出现后，还要等场景、产品和习惯一起成熟。", "visual": ["网络能力", "终端设备", "应用场景", "用户习惯"], "mode": "equation", "line": "网络升级会降低传输时间、扩大可传数据量，为视频、云服务和移动应用创造条件。但技术升级本身，不会自动创造一个成功产品。真正的变化通常来自能力、设备、场景、商业模式和用户习惯的组合。所以我们谈未来时，最好讲“创造条件”，而不是把某个新产品简单归因给一代网络。", "bridge": "软件不只连接人，也开始根据人的偏好组织内容。", "refs": "ITU, IMT-2020 recommendation: https://www.itu.int/rec/R-REC-M.2083/en"}, {"section": "软件理解用户", "title": "同一个 App，首页可能因人而异", "lead": "推荐系统，用行为信号调整内容排序。", "visual": ["兴趣 A", "兴趣 B", "共同内容池", "不同信息流"], "mode": "split", "line": "推荐系统会参考点击、停留、反馈等行为信号，对内容进行排序。同一款应用，不同人看到的内容可能不同，于是首页逐渐从固定菜单变成个性化信息流。推荐系统出现得比短视频平台早得多；如果分享自己的经历，可以说“那几年我明显感受到相关岗位变多”，不要把它讲成算法的诞生年份。", "bridge": "从软件猜你喜欢什么，到模型听懂你要做什么。", "refs": "Netflix Prize（2006）：https://www.netflixprize.com/；Google Research, YouTube Recommendations：https://research.google/pubs/deep-neural-networks-for-youtube-recommendations/"}, {"section": "AI 理解意图", "title": "从搜索资料，到直接表达问题", "lead": "聊天模型尝试组织答案；重要信息仍要核实。", "visual": ["关键词", "浏览资料", "自己整理", "自然提问", "得到草稿"], "mode": "compare", "line": "搜索引擎让人通过关键词找到网页，再自己比较和整理。聊天模型让人可以用自然语言说出问题，并得到一份组织好的回答。这会让知识获取更直接，但回答听起来流畅，不代表每个细节都正确。直播里可以用做菜、整理行程这类普通例子来说明交互变化，不用夸大成“什么都知道”。", "bridge": "想让回答更有用，除了问法，还要给它合适的背景。", "refs": "OpenAI, GPT-4 Technical Report：https://arxiv.org/abs/2303.08774（报告未公开完整训练数据细节）。"}, {"section": "人机协作", "title": "先说清目标，再给它需要的背景", "lead": "任务越清楚、信息越相关，来回沟通越少。", "visual": ["目标", "背景", "约束", "可用结果"], "mode": "stack", "line": "最早大家会花很多时间打磨提示词。但日常使用中，关键不在于背一套咒语，而是说清目标、提供有用背景、补上限制条件。上下文工程说的是为任务整理相关信息，不是把所有资料不加筛选地塞进去。", "bridge": "当模型能调用工具，它就能从“给建议”走向“做步骤”。", "refs": "Anthropic, Effective Context Engineering：https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents。In-context learning 基础论文：https://arxiv.org/abs/2005.14165。"}, {"section": "从回答到行动", "title": "Agent 会用工具，也会看结果再继续", "lead": "目标 → 拆步骤 → 调工具 → 检查结果。", "visual": ["明确目标", "拆解步骤", "使用工具", "读取反馈", "完成或修正"], "mode": "loop", "line": "Agent 可以在任务中调用工具，再根据工具返回的结果决定下一步。比如整理一份资料：先搜索文件、提取内容、生成摘要，再检查有没有遗漏。重要的是“行动—反馈—修正”这个闭环，不是它会调用工具就意味着一定做对。MCP 等协议帮助应用连接工具和数据，但具体权限还要由产品设计。", "bridge": "为什么代码任务先出现这种闭环？因为结果比较容易检查。", "refs": "MCP 官方介绍：https://modelcontextprotocol.io/docs/getting-started/intro；Anthropic, Building Effective Agents：https://www.anthropic.com/engineering/building-effective-agents。"}, {"section": "可验证的任务", "title": "代码适合先试，是因为结果能检查", "lead": "运行、对照、修正，让问题更容易被发现。", "visual": ["读需求", "改代码", "运行验证", "查看差异", "人工确认"], "mode": "loop", "line": "代码任务有一个特点：很多结果可以通过运行、测试和查看差异来检查。因此，AI 更早在编程辅助领域显示出实用价值。但这不等于它能独立、稳定地交付所有复杂系统。人仍要判断需求是否实现、修改有没有副作用，以及是否可以交付。", "bridge": "能做更多事之后，权限边界就变得更重要。", "refs": "Anthropic, Claude 3.7 Sonnet 发布资料：https://www.anthropic.com/news/claude-3-7-sonnet。"}, {"section": "权限与信任", "title": "能执行，也要知道什么时候停下来", "lead": "低风险可自动；高影响动作先确认。", "visual": ["读取 / 草拟", "限定范围内修改", "付款 / 删除 / 发布前确认"], "mode": "tiers", "line": "把任务按影响程度分层会更容易理解：读取资料、生成草稿这类低风险动作可以更自动；修改文件或发起流程，需要限制范围并保留检查入口；涉及付款、删除、发布等可能产生明显后果的动作，执行前应让人确认。让 AI 有能力做事，同时让人知道它做了什么、依据什么、结果如何。", "bridge": "这会让人的工作重点从逐步操作，转向设定目标和验收。", "refs": "抖音《直播行为规范》会动态更新；开播前请查看官方规则页面：https://sf3-cdn-tos.douyinstatic.com/obj/ies-hotsoon-draft/webcast_all_anchor/webcast_ban_protocol.html。此处只是内容自查提醒，不构成审核结果。"}, {"section": "工作方式", "title": "AI 扩大工作半径，人负责判断和交付", "lead": "任务链可能变短，责任仍需要人承担。", "visual": ["过去：多环节接力", "现在：人定义目标", "AI 协助推进", "人检查交付"], "mode": "shift", "line": "过去，一个项目往往要经过多个专业角色协作。AI 工具能把部分任务串起来，让一个人先完成更多环节。更稳妥的说法是工作方式和协作边界在变化，而不是所有岗位已经消失。人的价值会更多体现在目标定义、判断取舍、整合资源和对结果负责。", "bridge": "如果 AI 能跨多个应用推进任务，竞争焦点可能继续往入口移动。", "refs": "FDE、一人公司等词可以作为工作形态讨论，但不说成已经普遍发生的岗位替代。"}, {"section": "趋势推演", "title": "下一层竞争，可能是“谁来协调任务”", "lead": "模型能力之外，还要看入口、工具和信任。", "visual": ["听懂意图", "组织步骤", "协调应用", "权限确认", "回传结果"], "mode": "network", "line": "我的判断是，未来竞争可能不只发生在模型回答质量上，也会延伸到谁能把用户目标拆成步骤、协调工具和应用、处理授权，再把结果交回来。这是一种观察框架，不是一个已经被行业统一定义的“AI 操作系统”，更不是某一家公司必胜的预言。", "bridge": "可能的实现路径，不止是推出一套新系统。", "refs": "操作系统定义可参考 NIST：https://csrc.nist.gov/glossary/term/OS。本文把“AI OS”明确作为趋势假说使用。"}, {"section": "三种路径", "title": "总入口可能沿三条路演进", "lead": "现有系统、应用接口、跨应用协调层。", "visual": ["系统能力增强", "应用开放动作", "Agent 协调服务"], "mode": "steps", "line": "一种可能是现有手机和电脑系统加强 AI 能力；另一种是应用开放更清楚的动作接口；也可能出现跨应用的协调层，在用户授权下完成多步任务。它们可能并行，也可能彼此结合。Apple App Intents 等资料说明，现有系统也在探索让应用动作更容易被调用。最终走哪条路，要看体验、安全和应用是否愿意接入。", "bridge": "那我们怎样判断这条趋势到底有没有发生？", "refs": "Apple App Intents：https://developer.apple.com/documentation/AppIntents；Android AccessibilityService：https://developer.android.com/reference/android/accessibilityservice/AccessibilityService。"}, {"section": "如何观察", "title": "先观察四件事，再判断趋势", "lead": "完成率、可信度、生态、用户授权。", "visual": ["任务能否完成", "结果是否可信", "应用愿不愿接入", "用户愿意授权什么"], "mode": "steps", "line": "不用急着押赢家，可以先看四个信号：跨应用任务能否稳定完成；结果能不能解释和检查；应用开发者愿不愿开放动作；用户愿意授权哪些数据和操作。如果这几项持续改善，系统入口的价值可能上升。如果长期停留在封闭的小场景，这个判断就应该收缩。", "bridge": "最后留一个问题，交给直播间的朋友。", "refs": "以上是分析框架与个人推演，未来可被新证据修正。"}, {"section": "收束", "title": "你愿意把哪件日常任务交给 AI？", "lead": "从一个真实场景，继续讨论 AI 的下一步。", "visual": ["听懂目标", "安全执行", "交回结果"], "mode": "rail", "line": "今天我们沿着一条主线，从计算普及、互联网连接、移动入口和个性化软件，走到今天的自然语言模型与 Agent。我的观察是：下一步值得关注的，可能是 AI 能否安全、可靠地替人协调任务。你最希望它先帮你完成哪件日常小事？", "bridge": "结束时回到核心判断：这是值得观察的方向，不是已经注定的结局。", "refs": "避免口播为确定预测；使用观众可讨论的日常任务作为互动。"}];
const params=new URLSearchParams(location.search);const audienceMode=params.has('audience');let idx=0;let audienceWin=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderSlide(s,i){return `<section class="slide ${i===idx?'active':''}" data-index="${i}"><div class="s-top"><span>${esc(s.section)}</span><span class="s-logo">AI · 2.0.0</span></div><h1 class="s-title">${esc(s.title)}</h1><p class="s-lead">${esc(s.lead)}</p><div class="visual" data-mode="${esc(s.mode)}">${visual(s)}</div>${['equation','split','shift'].includes(s.mode)?'':`<div class="statement">${esc(s.visual.length>3?s.visual.slice(0,3).join('  ·  '):s.visual.join('  →  '))}</div>`}<div class="progress"><i style="width:${(i+1)/slides.length*100}%"></i></div><span class="s-page">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></section>`}
function visual(s){const vals=s.visual,mode=s.mode;const makeCards=(arr,n)=>`<div class="cards cols${n}">${arr.map(x=>`<div class="vcard"><strong>${esc(x)}</strong></div>`).join('')}</div>`;if(mode==='cover')return `<div class="cover-wide"><div class="cover-steps">${vals.map((v,i)=>`<div class="cover-step"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(v)}</span></div>`).join('')}</div><img class="cover-art" src="ai-era-live-assets/04-cover-ai-era.png" alt="从早期大型计算机、个人电脑、智能手机到 AI 任务助手的演进"></div>`;if(mode==='rail')return `<div class="motif">${vals.map((v,i)=>`<div class="motif-row"><span class="motif-dot">${String(i+1).padStart(2,'0')}</span><div class="motif-bar"></div><b style="font-size:13px;white-space:nowrap">${esc(v)}</b></div>`).join('')}</div>`;if(mode==='steps')return `<div class="motif">${vals.map((v,i)=>`<div class="motif-row"><span class="motif-dot">${String(i+1).padStart(2,'0')}</span><div class="statement" style="flex:1">${esc(v)}</div></div>`).join('')}</div>`;if(mode==='network')return `<div class="motif">${vals.map((v,i)=>`<div class="statement" style="margin-left:${i*4}%;width:${100-i*4}%">${esc(v)}</div>`).join('')}</div>`;if(mode==='equation')return `<div class="motif">${makeCards(vals,2)}<div class="statement">能力 × 场景 × 产品 × 习惯</div></div>`;if(mode==='split')return `<div class="motif"><div class="split"><div><b>看到的内容 A</b><span>根据兴趣排序的信息</span></div><div><b>看到的内容 B</b><span>同一内容池，另一种排序</span></div></div><div class="statement">同一个 App · 不同的信息流</div></div>`;if(mode==='compare')return `<div class="motif"><div class="split"><div><b>搜索</b><span>找资料<br>自己比较<br>再整理</span></div><div><b>对话</b><span>说出问题<br>得到整理后的回答</span></div></div></div>`;if(mode==='stack')return `<div class="motif">${vals.map((v,i)=>`<div class="statement" style="margin-left:${i*5}%;width:${100-i*5}%">${esc(v)}</div>`).join('')}</div>`;if(mode==='loop')return `<div class="motif">${vals.map((v,i)=>`<div class="motif-row"><span class="motif-dot">${String(i+1).padStart(2,'0')}</span><div class="vcard" style="flex:1"><strong>${esc(v)}</strong></div></div>`).join('')}</div>`;if(mode==='tiers')return `<div class="motif">${vals.map((v,i)=>`<div class="vcard" style="border-left:4px solid ${['#748b70','#d9a56e','#dc5b27'][i]}"><strong>${esc(v)}</strong><small>${['自动处理','限制范围，保留复核','先确认，再执行'][i]}</small></div>`).join('')}</div>`;if(mode==='shift')return `<div class="motif"><div class="split"><div><b>过去</b><span>人按环节协作<br>逐步完成</span></div><div><b>现在</b><span>AI 协助推进<br>人定义和验收</span></div></div><div class="statement">人对目标和结果负责</div></div>`;return makeCards(vals,vals.length===3?3:2)}
function show(){document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));const s=slides[idx];if(!audienceMode){document.querySelector('#cue-label').textContent=`${String(idx+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}　${s.section}`;document.querySelector('#cue-title').textContent=s.title;document.querySelector('#script').textContent=s.line;document.querySelector('#bridge').textContent='转场：'+s.bridge;document.querySelector('#refs').textContent='备查：'+s.refs;document.querySelector('#which').textContent=`第 ${idx+1} 页 / 共 ${slides.length} 页`;}if(audienceWin&&!audienceWin.closed)audienceWin.postMessage({type:'slide',index:idx},'*')}
const srcs=['[1] University of Pennsylvania, ENIAC 历史：https://www.seas.upenn.edu/about/history-heritage/eniac/','[2] Apple, iPhone 发布资料：https://www.apple.com/newsroom/2007/01/09Apple-Reinvents-the-Phone-with-iPhone/','[3] CERN, The birth of the Web：https://home.cern/science/computing/birth-web','[4] ITU, IMT-2020：https://www.itu.int/rec/R-REC-M.2083/en','[5] Netflix Prize：https://www.netflixprize.com/','[6] Google Research, YouTube Recommendations：https://research.google/pubs/deep-neural-networks-for-youtube-recommendations/','[7] OpenAI, GPT-4 Technical Report：https://arxiv.org/abs/2303.08774','[8] Anthropic, Effective Context Engineering：https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents','[9] Model Context Protocol：https://modelcontextprotocol.io/docs/getting-started/intro','[10] Anthropic, Building Effective Agents：https://www.anthropic.com/engineering/building-effective-agents','[11] Anthropic, Claude 3.7 Sonnet：https://www.anthropic.com/news/claude-3-7-sonnet','[12] NIST, OS Glossary：https://csrc.nist.gov/glossary/term/OS','[13] Apple App Intents：https://developer.apple.com/documentation/AppIntents','[14] 抖音直播伴侣双屏开播指南：https://streamingtool.douyin.com/docs/guide_dual','[15] 抖音直播行为规范（开播前复核）：https://sf3-cdn-tos.douyinstatic.com/obj/ies-hotsoon-draft/webcast_all_anchor/webcast_ban_protocol.html'];
if(audienceMode){document.body.className='audience-mode';document.querySelector('#app').innerHTML=`<main class="workspace"><div class="viewer viewer-only">${slides.map(renderSlide).join('')}</div></main>`;window.addEventListener('message',e=>{if(e.source===window.opener&&e.data?.type==='slide'){idx=Math.max(0,Math.min(slides.length-1,e.data.index));show()}});}
else{document.querySelector('#app').innerHTML=`<main class="workspace"><div class="viewer">${slides.map(renderSlide).join('')}</div><aside class="host"><header class="host-head"><div class="host-title">主播提词台 · PC 横屏版</div><div class="version">LIVE DECK · 2.0.0</div></header><section class="cuebox"><div id="cue-label" class="cue-label"></div><h2 id="cue-title"></h2><div id="script" class="script"></div><div id="bridge" class="bridge"></div><div id="refs" class="source-host"></div><div id="which" class="source-host"></div><div class="refs"><b>直播前内容自查</b><br>口播以可核实事实和个人判断为界；规则、产品名称与新消息在开播前按抖音官方规范复核。观众画面不含此提词区。<br><br><b>资料（仅主播端备查）</b><br>${srcs.map(x=>`<a href="${x.slice(x.indexOf('http'))}" target="_blank" rel="noreferrer">${esc(x.slice(0,x.indexOf('http')).replace(/[：:，,\s]+$/,''))}</a>`).join('<br>')}</div></section><div class="host-controls"><button id="prev">← 上一页</button><button id="next">下一页 →</button><button id="sizeDown">A−</button><button id="sizeUp">A+</button><button class="open-audience" id="open">打开观众画面</button></div><div class="help">方向键翻页 · Home / End 跳转 · 观众窗口显示 16:9 横屏画面；主播话术留在此窗口。</div></aside></main>`;document.querySelector('#prev').onclick=()=>go(idx-1);document.querySelector('#next').onclick=()=>go(idx+1);document.querySelector('#open').onclick=()=>{audienceWin=window.open(location.href.split('?')[0]+'?audience=1','aiLiveAudience','width=1440,height=810');if(audienceWin)audienceWin.addEventListener('load',()=>audienceWin.postMessage({type:'slide',index:idx},'*'))};document.querySelector('#sizeUp').onclick=()=>font(1);document.querySelector('#sizeDown').onclick=()=>font(-1);}
function go(n){idx=Math.max(0,Math.min(slides.length-1,n));show()}function font(d){const el=document.querySelector('#script');const cur=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=Math.max(14,Math.min(28,cur+d*2))+'px'}window.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(idx+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1)});show();
