<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><g font-family="Microsoft YaHei, sans-serif"><rect width="1600" height="1180" fill="#fffefa"/><rect x="0" y="0" width="1600" height="15" fill="#252d39"/><text x="82" y="92" font-size="17" font-weight="700" fill="#c44b36">工具观察 · 2026</text><text x="82" y="151" font-size="46" font-weight="700" fill="#202733">AI 编程工具，已经长出好几种形态</text><text x="84" y="196" font-size="22" fill="#687180">按主要工作入口整理的代表产品；类别有交叉，不是热度排名。</text>
<circle cx="112" cy="267" r="23" fill="#327c72"/><text x="112" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">01</text><text x="160" y="273" font-size="24" font-weight="700" fill="#202733">编辑器里的搭档</text><text x="160" y="308" font-size="17" fill="#77808c">补全、解释、在当前项目里改代码</text><text x="630" y="270" font-size="20" fill="#303b4c">GitHub Copilot · Cursor · Windsurf</text><text x="630" y="307" font-size="19" fill="#596474">JetBrains AI / Junie · TRAE · 百度 Comate · 腾讯 CodeBuddy</text><line x1="160" y1="347" x2="1490" y2="347" stroke="#e5e2da" stroke-width="1.5"/><circle cx="112" cy="406" r="23" fill="#ca6448"/><text x="112" y="413" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">02</text><text x="160" y="412" font-size="24" font-weight="700" fill="#202733">终端与本地 Agent</text><text x="160" y="447" font-size="17" fill="#77808c">读仓库、跨文件修改、执行命令</text><text x="630" y="409" font-size="20" fill="#303b4c">Claude Code · OpenAI Codex · Grok Build</text><text x="630" y="446" font-size="19" fill="#596474">Qwen Code · MiniMax Code · Aider · Pi · OpenCode</text><line x1="160" y1="486" x2="1490" y2="486" stroke="#e5e2da" stroke-width="1.5"/><circle cx="112" cy="545" r="23" fill="#6c58a5"/><text x="112" y="552" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">03</text><text x="160" y="551" font-size="24" font-weight="700" fill="#202733">可定制的 Agent</text><text x="160" y="586" font-size="17" fill="#77808c">可换模型、扩展工具或配置工作流</text><text x="630" y="548" font-size="20" fill="#303b4c">Cline · Roo Code · Goose · OpenHands</text><text x="630" y="585" font-size="19" fill="#596474">Pi · OpenCode · Aider（产品能力各有差别）</text><line x1="160" y1="625" x2="1490" y2="625" stroke="#e5e2da" stroke-width="1.5"/><circle cx="112" cy="684" r="23" fill="#547bba"/><text x="112" y="691" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">04</text><text x="160" y="690" font-size="24" font-weight="700" fill="#202733">把任务交给云端跑</text><text x="160" y="725" font-size="17" fill="#77808c">异步处理 issue、代码任务或仓库改动</text><text x="630" y="687" font-size="20" fill="#303b4c">Devin · Google Jules · Codex Cloud</text><text x="630" y="724" font-size="19" fill="#596474">GitHub Copilot Coding Agent</text><line x1="160" y1="764" x2="1490" y2="764" stroke="#e5e2da" stroke-width="1.5"/><circle cx="112" cy="823" r="23" fill="#c18b2f"/><text x="112" y="830" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">05</text><text x="160" y="829" font-size="24" font-weight="700" fill="#202733">从描述快速做原型</text><text x="160" y="864" font-size="17" fill="#77808c">生成页面或应用，再继续迭代</text><text x="630" y="826" font-size="20" fill="#303b4c">Replit Agent · Bolt.new</text><text x="630" y="863" font-size="19" fill="#596474">Lovable · v0</text><line x1="160" y1="903" x2="1490" y2="903" stroke="#e5e2da" stroke-width="1.5"/><circle cx="112" cy="962" r="23" fill="#347b9a"/><text x="112" y="969" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">06</text><text x="160" y="968" font-size="24" font-weight="700" fill="#202733">桌面与聊天工作台</text><text x="160" y="1003" font-size="17" fill="#77808c">从桌面或聊天入口调用 AI 能力</text><text x="630" y="965" font-size="20" fill="#303b4c">腾讯 WorkBuddy · OpenClaw</text><text x="630" y="1002" font-size="19" fill="#596474">WorkBuddy 与 CodeBuddy 是不同产品</text><line x1="160" y1="1042" x2="1490" y2="1042" stroke="#e5e2da" stroke-width="1.5"/><text x="82" y="1100" font-size="20" font-weight="700" fill="#303b4c">入口不同，工作方式就不同；产品可以跨类，别把这张图当成能力排名。</text><text x="82" y="1140" font-size="17" fill="#77808c">产品功能持续变化，具体能力以各产品当前说明为准。</text></g></svg>