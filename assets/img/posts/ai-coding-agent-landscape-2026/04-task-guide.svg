<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930"><g font-family="Microsoft YaHei, sans-serif"><rect width="1500" height="930" fill="#f3f0e8"/><path d="M0 0h1500v16H0z" fill="#564d83"/><text x="82" y="88" font-size="44" font-weight="700" fill="#25243a">先看手里的任务，再挑工具</text><text x="84" y="132" font-size="21" fill="#716d7d">一个简单的起点，不是唯一答案</text>
<rect x="470" y="174" width="560" height="112" rx="56" fill="#564d83"/><text x="750" y="221" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">这次任务，需要它做到哪一步？</text><text x="750" y="257" text-anchor="middle" font-size="18" fill="#e4e0f0">从“给建议”到“替我完成并交付”</text>
<path d="M750 286 V326 M265 326 H1235 M265 326 V363 M750 326 V363 M1235 326 V363" fill="none" stroke="#827b9c" stroke-width="3"/>
<path d="M265 363v12" stroke="#347b69" stroke-width="4"/><rect x="70" y="375" width="390" height="174" rx="18" fill="#fffefa" stroke="#dcece5" stroke-width="3"/><rect x="70" y="375" width="10" height="174" rx="5" fill="#347b69"/><text x="98" y="414" font-size="20" font-weight="700" fill="#347b69">只想补全 / 改眼前一段</text><text x="98" y="454" font-size="24" font-weight="700" fill="#25243a">IDE 助手</text><text x="98" y="489" font-size="17" fill="#4f5260">Copilot · Cursor · JetBrains AI</text><text x="98" y="523" font-size="16" fill="#777783">留在编辑器里，逐处确认</text><path d="M750 363v12" stroke="#bd6043" stroke-width="4"/><rect x="555" y="375" width="390" height="174" rx="18" fill="#fffefa" stroke="#f5e1d5" stroke-width="3"/><rect x="555" y="375" width="10" height="174" rx="5" fill="#bd6043"/><text x="583" y="414" font-size="20" font-weight="700" fill="#bd6043">要读懂仓库 / 改多个文件</text><text x="583" y="454" font-size="24" font-weight="700" fill="#25243a">代码 Agent</text><text x="583" y="489" font-size="17" fill="#4f5260">Claude Code · Codex · Pi</text><text x="583" y="523" font-size="16" fill="#777783">给清楚范围，并检查 diff</text><path d="M1235 363v12" stroke="#6856a0" stroke-width="4"/><rect x="1040" y="375" width="390" height="174" rx="18" fill="#fffefa" stroke="#e7e1f2" stroke-width="3"/><rect x="1040" y="375" width="10" height="174" rx="5" fill="#6856a0"/><text x="1068" y="414" font-size="20" font-weight="700" fill="#6856a0">想快速搭一个可点的原型</text><text x="1068" y="454" font-size="24" font-weight="700" fill="#25243a">应用生成器</text><text x="1068" y="489" font-size="17" fill="#4f5260">Replit · Bolt · Lovable · v0</text><text x="1068" y="523" font-size="16" fill="#777783">先验证交互，再补工程细节</text><text x="84" y="620" font-size="20" font-weight="700" fill="#564d83">再看看任务有没有这些特点</text><rect x="70" y="650" width="390" height="178" rx="18" fill="#e5edf7"/><text x="92" y="689" font-size="18" font-weight="700" fill="#4874ae">任务可以异步交出去</text><text x="92" y="727" font-size="23" font-weight="700" fill="#25243a">云端 Agent</text><text x="92" y="762" font-size="17" fill="#4f5260">Devin · Jules · Codex Cloud</text><text x="92" y="798" font-size="16" fill="#777783">先写好验收条件</text><rect x="555" y="650" width="390" height="178" rx="18" fill="#e9eee0"/><text x="577" y="689" font-size="18" font-weight="700" fill="#687f48">想从桌面或聊天派活</text><text x="577" y="727" font-size="23" font-weight="700" fill="#25243a">工作台 / 编排</text><text x="577" y="762" font-size="17" fill="#4f5260">WorkBuddy · OpenClaw</text><text x="577" y="798" font-size="16" fill="#777783">先管好授权与执行范围</text><rect x="1040" y="650" width="390" height="178" rx="18" fill="#f5e9ce"/><text x="1062" y="689" font-size="18" font-weight="700" fill="#a37521">希望按预算换模型</text><text x="1062" y="727" font-size="23" font-weight="700" fill="#25243a">可配置 Agent</text><text x="1062" y="762" font-size="17" fill="#4f5260">Pi · OpenCode · Cline</text><text x="1062" y="798" font-size="16" fill="#777783">试工具调用、长任务与返工率</text><text x="84" y="882" font-size="17" fill="#716d7d">产品可能跨类别：IDE 可以集成 Agent，Agent 也可能在云端运行。</text></g></svg>