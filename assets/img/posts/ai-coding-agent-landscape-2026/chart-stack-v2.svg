<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#1e2924}.title{font-size:30px;font-weight:750}.sub{font-size:16px;fill:#68756e}.head{font-size:20px;font-weight:750}.body{font-size:15px}.small{font-size:13px;fill:#59665f}.box{fill:#fffefa;stroke:#dce1da;stroke-width:2}</style><rect width="1200" height="660" rx="24" fill="#f4f3ef"/><text x="52" y="58" class="title">一套 AI 编程方案，通常由几层东西拼起来</text><text x="52" y="88" class="sub">分清工作界面、Agent、模型和路由，才知道自己在选哪一层</text><rect class="box" x="50" y="125" width="270" height="420" rx="18"/><rect class="box" x="350" y="125" width="270" height="420" rx="18"/><rect class="box" x="650" y="125" width="270" height="420" rx="18"/><rect class="box" x="950" y="125" width="200" height="420" rx="18"/>
<text x="76" y="165" class="head">工作界面</text><text x="76" y="205" class="body">IDE · VS Code / Cursor</text><text x="76" y="237" class="body">终端 · CLI / TUI</text><text x="76" y="269" class="body">云端 · Issue / PR</text><text x="76" y="301" class="body">消息 · Telegram / Slack</text><text x="76" y="365" class="small">人从这里下任务、看改动，</text><text x="76" y="386" class="small">决定是否接受结果。</text>
<text x="376" y="165" class="head">Agent / Harness</text><text x="376" y="205" class="body">Claude Code · Codex</text><text x="376" y="237" class="body">OpenCode · Pi · Aider</text><text x="376" y="269" class="body">Copilot Agent · Devin</text><text x="376" y="301" class="body">OpenClaw · 消息编排</text><text x="376" y="365" class="small">读项目、调用工具、修改代码，</text><text x="376" y="386" class="small">再把结果交回来。</text>
<text x="676" y="165" class="head">模型</text><text x="676" y="205" class="body">Claude · GPT · Gemini</text><text x="676" y="237" class="body">DeepSeek · MiniMax · Qwen</text><text x="676" y="269" class="body">Grok · 本地模型</text><text x="676" y="365" class="small">负责理解、推理和生成；</text><text x="676" y="386" class="small">不同 Agent 的兼容性不同。</text>
<text x="976" y="165" class="head">Provider / 路由</text><text x="976" y="205" class="body">官方 API</text><text x="976" y="237" class="body">OpenRouter</text><text x="976" y="269" class="body">LiteLLM</text><text x="976" y="301" class="body">本地服务</text><text x="976" y="365" class="small">连接模型服务，</text><text x="976" y="386" class="small">按需选择。</text>
<path d="M325 335h18m-7-7 7 7-7 7M625 335h18m-7-7 7 7-7 7M925 335h18m-7-7 7 7-7 7" fill="none" stroke="#176b4a" stroke-width="3"/><rect x="50" y="575" width="1100" height="62" rx="14" fill="#e5edde"/><text x="74" y="601" class="small" font-weight="700">常见搭配</text><text x="205" y="601" class="small">原生：Claude Code + Claude / Codex + GPT</text><text x="205" y="622" class="small">可插拔：Pi / OpenCode + 自选模型　 ·　 异步：云端 Agent + GitHub PR</text></svg>