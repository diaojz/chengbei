<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#1e2924}.title{font-size:30px;font-weight:750}.sub{font-size:16px;fill:#68756e}.head{font-size:20px;font-weight:750}.body{font-size:16px}.small{font-size:14px;fill:#59665f}.box{fill:#fffefa;stroke:#dce1da;stroke-width:2}</style><rect width="1200" height="660" rx="24" fill="#f4f3ef"/><text x="52" y="58" class="title">一个“AI 编程方案”，通常是几层东西拼出来的</text><text x="52" y="88" class="sub">不要把 Agent、模型、IDE、路由器和消息机器人当成同一类产品</text><rect class="box" x="50" y="125" width="270" height="430" rx="18"/><rect class="box" x="350" y="125" width="270" height="430" rx="18"/><rect class="box" x="650" y="125" width="270" height="430" rx="18"/><rect class="box" x="950" y="125" width="200" height="430" rx="18"/><text x="76" y="165" class="head">入口 / 工作界面</text><text x="76" y="198" class="body">IDE：Cursor、VS Code</text><text x="76" y="228" class="body">终端：CLI / TUI</text><text x="76" y="258" class="body">云端：Issue / PR / Web</text><text x="76" y="288" class="body">消息：Telegram / Slack</text><text x="76" y="350" class="small">用户在哪下指令、看差异、</text><text x="76" y="374" class="small">审批与接收结果</text><text x="376" y="165" class="head">Agent / Harness</text><text x="376" y="198" class="body">Claude Code · Codex</text><text x="376" y="228" class="body">OpenCode · Pi · Aider</text><text x="376" y="258" class="body">Copilot Agent · Devin</text><text x="376" y="288" class="body">OpenClaw（编排/消息层）</text><text x="376" y="350" class="small">读仓库、调工具、执行循环、</text><text x="376" y="374" class="small">修改文件并回报</text><text x="676" y="165" class="head">模型 / 推理</text><text x="676" y="198" class="body">Claude · GPT · Gemini</text><text x="676" y="228" class="body">DeepSeek · MiniMax · Qwen</text><text x="676" y="258" class="body">Grok · 开源本地模型</text><text x="676" y="350" class="small">决定理解、推理、代码质量；</text><text x="676" y="374" class="small">各 Agent 兼容能力不同</text><text x="976" y="165" class="head">连接 / 路由</text><text x="976" y="205" class="body">官方 API</text><text x="976" y="235" class="body">OpenRouter</text><text x="976" y="265" class="body">LiteLLM</text><text x="976" y="295" class="body">本地服务</text><text x="976" y="350" class="small">按需选模型/Provider</text><text x="976" y="374" class="small">可选，不是 Agent 本身</text><path d="M325 335h18m-7-7 7 7-7 7M625 335h18m-7-7 7 7-7 7M925 335h18m-7-7 7 7-7 7" fill="none" stroke="#176b4a" stroke-width="3"/><rect x="50" y="585" width="1100" height="42" rx="12" fill="#e5edde"/><text x="75" y="612" class="small">常见组合：原生闭环（Claude Code + Claude / Codex + GPT）｜可插拔（Pi/OpenCode + 自选 Provider）｜异步协作（云端 Agent + GitHub PR）</text></svg>