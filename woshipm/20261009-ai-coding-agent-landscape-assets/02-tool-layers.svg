<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><g font-family="Microsoft YaHei, sans-serif"><rect width="1500" height="1000" fill="#f5f3ed"/><circle cx="1310" cy="150" r="170" fill="#e4eaf2"/><text x="84" y="100" font-size="44" font-weight="700" fill="#202b3b">一套 AI 编程工作流，通常不止一个名字</text><text x="86" y="148" font-size="22" fill="#677486">界面、Agent、模型和接入服务，各自负责一段工作</text>
<rect x="84" y="210" width="940" height="142" rx="20" fill="#fffefa" stroke="#d9dfeb" stroke-width="2"/><rect x="84" y="210" width="11" height="142" rx="5" fill="#63d5c4"/><text x="116" y="254" font-size="18" font-weight="700" fill="#63d5c4">01</text><text x="160" y="261" font-size="28" font-weight="700" fill="#202b3b">工作界面</text><text x="160" y="301" font-size="17" fill="#707b8c">人在这里操作</text><text x="430" y="264" font-size="22" fill="#202b3b">VS Code · Cursor · Windsurf · JetBrains IDE</text><text x="430" y="306" font-size="19" fill="#677486">编辑、查看建议、审阅改动</text><path d="M550 355 v21 m-8 -9 8 9 8 -9" fill="none" stroke="#7c8da7" stroke-width="3"/><rect x="84" y="384" width="940" height="142" rx="20" fill="#fffefa" stroke="#d9dfeb" stroke-width="2"/><rect x="84" y="384" width="11" height="142" rx="5" fill="#f0a27e"/><text x="116" y="428" font-size="18" font-weight="700" fill="#f0a27e">02</text><text x="160" y="435" font-size="28" font-weight="700" fill="#202b3b">Agent</text><text x="160" y="475" font-size="17" fill="#707b8c">读任务、调工具、改代码</text><text x="430" y="438" font-size="22" fill="#202b3b">Claude Code · Codex · OpenCode · Pi</text><text x="430" y="480" font-size="19" fill="#677486">Cline · Grok Build（Grok 模型 + 编程 Agent）</text><path d="M550 529 v21 m-8 -9 8 9 8 -9" fill="none" stroke="#7c8da7" stroke-width="3"/><rect x="84" y="558" width="940" height="142" rx="20" fill="#fffefa" stroke="#d9dfeb" stroke-width="2"/><rect x="84" y="558" width="11" height="142" rx="5" fill="#b59af7"/><text x="116" y="602" font-size="18" font-weight="700" fill="#b59af7">03</text><text x="160" y="609" font-size="28" font-weight="700" fill="#202b3b">模型</text><text x="160" y="649" font-size="17" fill="#707b8c">负责理解与生成</text><text x="430" y="612" font-size="22" fill="#202b3b">Claude · GPT · Gemini · DeepSeek · MiniMax</text><text x="430" y="654" font-size="19" fill="#677486">Qwen · Grok · 也可以是本地模型</text><path d="M550 703 v21 m-8 -9 8 9 8 -9" fill="none" stroke="#7c8da7" stroke-width="3"/><rect x="84" y="732" width="940" height="142" rx="20" fill="#fffefa" stroke="#d9dfeb" stroke-width="2"/><rect x="84" y="732" width="11" height="142" rx="5" fill="#e6c765"/><text x="116" y="776" font-size="18" font-weight="700" fill="#e6c765">04</text><text x="160" y="783" font-size="28" font-weight="700" fill="#202b3b">接入与路由</text><text x="160" y="823" font-size="17" fill="#707b8c">把 Agent 连到模型</text><text x="430" y="786" font-size="22" fill="#202b3b">模型官方 API · OpenRouter · LiteLLM</text><text x="430" y="828" font-size="19" fill="#677486">按服务、预算或配置选择连接方式</text><rect x="1070" y="250" width="350" height="220" rx="22" fill="#e8f2ed" stroke="#b8d8ca" stroke-width="2"/><text x="1100" y="300" font-size="25" font-weight="700" fill="#286a56">OpenClaw</text><text x="1100" y="344" font-size="21" fill="#284539">消息入口与调度</text><text x="1100" y="390" font-size="18" fill="#526a5d">从聊天渠道接收任务，</text><text x="1100" y="422" font-size="18" fill="#526a5d">再交给一个或多个 Agent。</text>
<rect x="1070" y="510" width="350" height="245" rx="22" fill="#f6e9e2" stroke="#e8c6b7" stroke-width="2"/><text x="1100" y="560" font-size="25" font-weight="700" fill="#a95035">别混成一张榜</text><text x="1100" y="615" font-size="20" fill="#70483b">Claude Code + DeepSeek</text><text x="1100" y="653" font-size="18" fill="#705a52">是 Agent、模型与接入方式</text><text x="1100" y="684" font-size="18" fill="#705a52">的组合。能连上，不等于体验相同。</text><text x="86" y="940" font-size="18" fill="#747f8e">OpenClaw 位于任务入口 / 调度侧，不等同于代码 Agent 或模型。</text></g></svg>